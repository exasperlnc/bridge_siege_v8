<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b1620" />
    <title>Bridge Siege</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230f2534'/%3E%3Crect x='2' y='6' width='12' height='4' fill='%239a6a3a'/%3E%3Crect x='3' y='2' width='3' height='4' fill='%233b82f6'/%3E%3Crect x='10' y='10' width='3' height='4' fill='%23ef4444'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="lobby" class="screen">
      <div class="lobby-card">
        <h1>Bridge Siege</h1>
        <p class="sub">Build bridges across the chasm. Storm the gate.</p>
        <label class="field">Your name
          <input id="name" maxlength="20" autocomplete="nickname" placeholder="Player" />
        </label>
        <button id="create" class="btn primary big">Create online game</button>
        <div class="join-row">
          <input id="code" maxlength="5" placeholder="CODE" autocapitalize="characters" autocomplete="off" />
          <button id="join" class="btn big">Join</button>
        </div>
        <div class="divider"><span>or</span></div>
        <button id="local" class="btn big">Pass &amp; play on this device</button>
        <p id="lobby-error" class="error" role="alert"></p>
      </div>
    </div>

    <div id="game" class="screen" hidden>
      <header id="hud"></header>
      <main id="board-wrap"><canvas id="board"></canvas></main>
      <aside id="panel"></aside>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="overlay" hidden></div>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
